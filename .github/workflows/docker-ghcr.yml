name: Docker build & push (reusable)

on:
  workflow_call:
    inputs:
      image-name:
        description: "Imagen completa, sin tag (ej. ghcr.io/hexalis/api-processor)"
        required: true
        type: string
      context:
        description: "Build context"
        type: string
        default: "."
      dockerfile:
        description: "Ruta al Dockerfile"
        type: string
        default: "Dockerfile"
      push:
        description: "Publicar la imagen (false para PRs)"
        type: boolean
        default: true
      tags:
        description: "Tags para docker/metadata-action (multilinea)"
        type: string
        default: |
          type=ref,event=branch
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
      build-args:
        description: "Build args (multilinea KEY=VALUE)"
        type: string
        default: ""
    outputs:
      digest:
        description: "Digest de la imagen construida"
        value: ${{ jobs.build.outputs.digest }}
      tags:
        description: "Tags publicados"
        value: ${{ jobs.build.outputs.tags }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image-name }}
          tags: ${{ inputs.tags }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
