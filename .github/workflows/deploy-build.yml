name: Deploy from repo (build on server, reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment que contiene las variables DEPLOY_*"
        required: true
        type: string
      branch:
        description: "Rama a desplegar"
        required: true
        type: string
      dockerfile:
        description: "Ruta al Dockerfile (relativa a remote-path)"
        type: string
        default: "Dockerfile"
      context:
        description: "Build context (relativo a remote-path)"
        type: string
        default: "."
      docker-network:
        description: "Red Docker para la API y la migración (opcional)"
        type: string
        default: ""
      migrate-command:
        description: "Comando de migración antes de recrear el contenedor (opcional)"
        type: string
        default: ""
    secrets:
      ssh-private-key:
        description: "Clave privada SSH (runner → servidor)"
        required: true
      known-hosts:
        description: "known_hosts del servidor (opcional; si falta se usa ssh-keyscan)"
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.ssh-private-key }}
          KNOWN_HOSTS: ${{ secrets.known-hosts }}
          HOST: ${{ vars.DEPLOY_HOST }}
          SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || 22 }}
        run: |
          : "${SSH_KEY:?ssh-private-key is required}"
          : "${HOST:?DEPLOY_HOST is required}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Pull, build and run on server
        shell: bash
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER_NAME: ${{ vars.DEPLOY_USER }}
          SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || 22 }}
          REMOTE_PATH: ${{ vars.DEPLOY_REMOTE_PATH }}
          BRANCH: ${{ inputs.branch }}
          CONTAINER: ${{ vars.DEPLOY_CONTAINER }}
          IMAGE_TAG: ${{ vars.DEPLOY_IMAGE_TAG }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
          PORTS: ${{ vars.DEPLOY_PORTS }}
          DOCKER_NETWORK: ${{ inputs.docker-network }}
          MIGRATE_COMMAND: ${{ inputs.migrate-command }}
          ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
          USE_SUDO: ${{ vars.DEPLOY_USE_SUDO || 'false' }}
          EXTRA_ARGS: ${{ vars.DEPLOY_EXTRA_RUN_ARGS }}
          HEALTH_TIMEOUT: ${{ vars.DEPLOY_HEALTH_TIMEOUT_SECONDS || 120 }}
        run: |
          set -euo pipefail
          : "${HOST:?DEPLOY_HOST is required}"
          : "${USER_NAME:?DEPLOY_USER is required}"
          : "${REMOTE_PATH:?DEPLOY_REMOTE_PATH is required}"
          : "${CONTAINER:?DEPLOY_CONTAINER is required}"
          : "${IMAGE_TAG:?DEPLOY_IMAGE_TAG is required}"
          : "${PORTS:?DEPLOY_PORTS is required}"

          SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes"
          TARGET="$USER_NAME@$HOST"
          if [ "$USE_SUDO" = "true" ]; then SUDO="sudo"; else SUDO=""; fi

          $SSH "$TARGET" \
            "REMOTE_PATH='$REMOTE_PATH' BRANCH='$BRANCH' CONTAINER='$CONTAINER' IMAGE_TAG='$IMAGE_TAG' DOCKERFILE='$DOCKERFILE' CONTEXT='$CONTEXT' PORTS='$PORTS' DOCKER_NETWORK='$DOCKER_NETWORK' MIGRATE_COMMAND='$MIGRATE_COMMAND' ENV_FILE='$ENV_FILE' HEALTH_URL='$HEALTH_URL' EXTRA_ARGS='$EXTRA_ARGS' HEALTH_TIMEOUT='$HEALTH_TIMEOUT' SUDO='$SUDO' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$REMOTE_PATH"
          git fetch --prune origin
          git reset --hard "origin/$BRANCH"

          echo "==> building $IMAGE_TAG from $(git rev-parse --short HEAD)"
          $SUDO docker build -t "$IMAGE_TAG" -f "$DOCKERFILE" "$CONTEXT"

          NETWORK_ARG=""
          if [ -n "$DOCKER_NETWORK" ]; then
            NETWORK_ARG="--network $DOCKER_NETWORK"
          fi

          ENV_ARG=""
          if [ -n "$ENV_FILE" ]; then
            if ! $SUDO test -r "$ENV_FILE"; then
              echo "ERROR: env file no legible por el usuario de deploy: $ENV_FILE" >&2
              echo "Revisa owner/grupo/permisos (ej. root:deploy 640 en /etc/hexalis)." >&2
              exit 1
            fi
            ENV_ARG="--env-file $ENV_FILE"
          fi

          if [ -n "$MIGRATE_COMMAND" ]; then
            echo "==> running migration: $MIGRATE_COMMAND"
            # shellcheck disable=SC2086
            $SUDO docker run --rm $NETWORK_ARG $ENV_ARG "$IMAGE_TAG" sh -c "$MIGRATE_COMMAND"
          fi

          $SUDO docker stop "$CONTAINER" 2>/dev/null || true
          $SUDO docker rm "$CONTAINER" 2>/dev/null || true

          # shellcheck disable=SC2086
          $SUDO docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            $NETWORK_ARG \
            -p "$PORTS" \
            $ENV_ARG \
            $EXTRA_ARGS \
            "$IMAGE_TAG"

          if [ -n "$HEALTH_URL" ]; then
            for i in $(seq 1 "$HEALTH_TIMEOUT"); do
              if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
                echo "healthy after ${i}s"
                exit 0
              fi
              sleep 1
            done
            echo "healthcheck failed after ${HEALTH_TIMEOUT}s" >&2
            $SUDO docker logs --tail 120 "$CONTAINER" >&2 || true
            exit 1
          fi

          echo "deployed (no health check configured)"
          REMOTE
